# Suchindex fuer das Berichte-Archiv, die Chronik und den Fahrzeug-Rundgang (Pagefind, laeuft komplett auf diesem Server).
# Nach jedem neuen oder geaenderten Bericht neu erzeugen und mit committen:
#   npx pagefind@1.5.2        (im Repo-Hauptordner ausfuehren)
site: .
output_subdir: pagefind
glob: "{berichte/**/*.html,wehr/chronik/index.html,bewerbe/geschichte/index.html,fahrzeug/rundgang/index.html}"
root_selector: "article"
exclude_selectors:
  - ".gallery"
force_language: de
