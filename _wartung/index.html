<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite in Bearbeitung – Freiwillige Feuerwehr Waidegg</title>
<meta name="description" content="Die Website der Freiwilligen Feuerwehr Waidegg wird gerade überarbeitet und ist demnächst wieder verfügbar.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f3eee4">
<style>
@font-face{font-family:"Oswald";font-weight:500;font-display:swap;src:url("/fonts/oswald-500.woff2") format("woff2")}
:root{--paper:#f3eee4;--sheet:#fbf7f1;--ink:#1c1b19;--muted:#5e574e;--line:#d4cbbc;--ember:#a4161a;--ember-deep:#7c1014;--display:"Oswald","Arial Narrow",sans-serif;--serif:"Source Serif 4",Palatino,"Palatino Linotype",Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:1.0625rem;line-height:1.6}
.ember-bar{height:4px;background:var(--ember);flex:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(1.25rem,5vw,3rem) 1rem}
.card{width:100%;max-width:36rem;background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--ember);padding:clamp(1.5rem,5vw,3rem) clamp(1.25rem,5vw,3rem);text-align:center}
.card img{display:block;width:clamp(72px,18vw,110px);height:auto;margin:0 auto 1rem}
.kicker{margin:0;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(.85rem,2.6vw,1rem);color:var(--ember-deep)}
h1{margin:.4rem 0 .8rem;font-family:var(--display);font-weight:500;line-height:1.15;font-size:clamp(1.6rem,6vw,2.4rem)}
.online{margin:0 0 .9rem;font-family:var(--display);font-weight:500;letter-spacing:.03em;line-height:1.3;font-size:clamp(1.1rem,3.6vw,1.35rem);color:var(--ember-deep)}
.lead{margin:0 0 1.75rem;color:var(--muted);font-size:clamp(1rem,3vw,1.15rem)}
.notruf{display:inline-block;padding:.75rem 1.4rem;background:var(--ember);color:#fff;text-decoration:none;font-family:var(--display);font-weight:500;letter-spacing:.04em;font-size:clamp(1rem,3.4vw,1.2rem);border-radius:3px}
.notruf:hover,.notruf:focus-visible{background:var(--ember-deep)}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
footer{flex:none;border-top:1px solid var(--line);padding:1rem;text-align:center;color:var(--muted);font-size:.95rem}
footer p{margin:0}
@media (orientation:landscape) and (max-height:500px){main{padding:1rem}.card{padding:1.25rem 2rem}.card img{width:64px;margin-bottom:.5rem}.lead{margin-bottom:1rem}}
</style>
</head>
<body>
<div class="ember-bar"></div>
<main>
<div class="card">
<img src="/flamme.png" alt="" width="180" height="180">
<p class="kicker">Freiwillige Feuerwehr Waidegg</p>
<h1>Unsere Website wird gerade überarbeitet</h1>
<p class="online">Wir gehen am <time datetime="2026-11-01T18:00+01:00">1.&nbsp;November&nbsp;2026 um 18:00&nbsp;Uhr</time> online.</p>
<p class="lead">Bald sind wir wieder für Sie da.</p>
<a class="notruf" href="tel:122">Im&nbsp;Notfall:&nbsp;Feuerwehr&#8209;Notruf&nbsp;122</a>
</div>
</main>
<footer><p>Ortswehr der Marktgemeinde Kirchbach. Im Dienste für die Bevölkerung.</p></footer>
</body>
</html>
