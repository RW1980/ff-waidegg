<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – FF Waidegg</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-wrap { max-width: 48rem; margin: 2rem auto; padding: 0 1.25rem 3rem; }
    .admin-box { background: var(--sheet); border: 1px solid var(--line); padding: 1.4rem; }
    .admin-box h1 { margin-top: 0; }
    label { display: block; font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; color: var(--muted); margin: .8rem 0 .3rem; }
    input[type="password"], input[type="text"], input[type="date"], textarea {
      width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit;
    }
    textarea { min-height: 10rem; }
    .admin-btn {
      display: inline-block; margin-top: 1rem; background: var(--ember); color: var(--sheet); border: 0;
      font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; padding: .7rem 1.1rem; cursor: pointer;
    }
    .admin-btn:hover { background: var(--ember-deep); }
    .admin-note { color: var(--muted); font-size: .92rem; margin-top: 1rem; }
    .report-list { list-style: none; padding: 0; margin: 1rem 0; }
    .report-list li { border-bottom: 1px solid var(--line); padding: .5rem 0; display: flex; justify-content: space-between; gap: 1rem; }
    .report-list button { background: none; border: 0; color: var(--ember-deep); cursor: pointer; font: inherit; }
    .hidden { display: none; }
    .admin-link { color: transparent; font-size: .6rem; text-decoration: none; }
    .admin-link:hover, .admin-link:focus { color: var(--muted); }
  </style>
</head>
<body>
  <a class="skip" href="#inhalt">Zum Inhalt</a>
  <div class="ember-bar"></div>
  <header class="site-head">
    <div class="brand-row">
      <a class="brand" href="/">
        <img src="/flamme.png" alt="" width="250" height="250">
        <span><small>Freiwillige Feuerwehr</small><strong>Waidegg</strong></span>
      </a>
    </div>
  </header>
  <main id="inhalt" class="admin-wrap">
    <div id="login" class="admin-box">
      <p class="kicker">Intern</p>
      <h1>Admin</h1>
      <form id="login-form">
        <label for="pw">Passwort</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <button class="admin-btn" type="submit">Anmelden</button>
      </form>
      <p id="login-error" class="admin-note hidden">Passwort stimmt nicht.</p>
    </div>

    <div id="app" class="admin-box hidden">
      <p class="kicker">Admin</p>
      <h1>Berichte</h1>
      <p class="admin-note">Änderungen werden lokal vorbereitet. Zum Live-Schalten die Datei herunterladen und mir schicken, oder wir verbinden später GitHub.</p>
      <button class="admin-btn" id="new-btn" type="button">Neuer Bericht</button>
      <ul id="list" class="report-list"></ul>

      <form id="editor" class="hidden">
        <label for="title">Überschrift</label>
        <input id="title" type="text" required>
        <label for="date">Datum</label>
        <input id="date" type="date" required>
        <label for="text">Text</label>
        <textarea id="text" required></textarea>
        <label for="photos">Foto-Pfade (eine Zeile pro Bild, z. B. /fotos/beispiel/01.avif)</label>
        <textarea id="photos" style="min-height:6rem"></textarea>
        <button class="admin-btn" type="submit">HTML herunterladen</button>
        <button class="admin-btn" type="button" id="cancel" style="background:var(--coal);margin-left:.5rem">Abbrechen</button>
      </form>
      <p style="margin-top:2rem"><button class="admin-btn" type="button" id="logout" style="background:var(--coal)">Abmelden</button></p>
    </div>
  </main>
  <script>
    const PW = "waidegg1895";
    const login = document.getElementById("login");
    const app = document.getElementById("app");
    const form = document.getElementById("login-form");
    const err = document.getElementById("login-error");
    const list = document.getElementById("list");
    const editor = document.getElementById("editor");

    const reports = [
      { id: "neueröffnung-gailbrücke-waidegg", title: "Neueröffnung Gailbrücke Waidegg", date: "2026-09-18", text: "Neueröffnung der Waidegger Gailbrücke.", photos: [] },
      { id: "maschinistenlehrgang", title: "Maschinistenlehrgang", date: "2026-09-20", text: "Drei neue Maschinisten in der FF-Waidegg.", photos: [] },
      { id: "cupsaison-2026", title: "Cupsaison 2026", date: "2026-08-18", text: "Bewerbssaison 2026 erfolgreich abgeschlossen.", photos: [] }
    ];

    function slug(s) {
      return s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    }
    function showList() {
      list.innerHTML = reports.map((r, i) => `<li><span>${r.date} · ${r.title}</span><button type="button" data-i="${i}">Bearbeiten</button></li>`).join("");
      list.querySelectorAll("button").forEach(b => b.onclick = () => open(Number(b.dataset.i)));
    }
    function open(i) {
      const r = reports[i];
      document.getElementById("title").value = r.title;
      document.getElementById("date").value = r.date;
      document.getElementById("text").value = r.text;
      document.getElementById("photos").value = (r.photos || []).join("\n");
      editor.dataset.i = i;
      editor.classList.remove("hidden");
    }
    function htmlFor(r) {
      const photos = (r.photos || []).filter(Boolean);
      const hero = photos[0] ? `<figure class="hero-cover"><a href="${photos[0]}"><img src="${photos[0]}" alt="${r.title}"></a></figure>` : "";
      const gal = photos.slice(1).map((p, i) => `<a href="${p}"><img src="${p}" alt="${r.title}, Bild ${i+2}" loading="lazy"></a>`).join("");
      const gallery = gal ? `<div class="gallery" aria-label="Fotos">${gal}</div>` : "";
      return `<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${r.title} – FF Waidegg</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#inhalt">Zum Inhalt</a>
  <div class="ember-bar"></div>
  <header class="site-head">
    <div class="brand-row">
      <a class="brand" href="/"><img src="/flamme.png" alt=""><span><small>Freiwillige Feuerwehr</small><strong>Waidegg</strong></span></a>
      <a class="notruf" href="tel:122">Notruf 122</a>
    </div>
    <nav class="nav-row"><a href="/">Start</a><a href="/aktuelles/">Aktuelles</a><a href="/wehr/">Unsere Wehr</a><a href="/mannschaft/">Mannschaft</a><a href="/fahrzeug/">Fahrzeug und Geräte</a><a href="/bewerbe/">Bewerbe</a><a href="/notfall/">Notfall</a><a href="/links/">Nützliche Links</a><a href="/archiv/">Archiv</a><a href="/impressum/">Impressum</a></nav>
  </header>
  <main id="inhalt">
    <p class="kicker">Bericht</p>
    <article>
      <time class="meta" datetime="${r.date}">${r.date}</time>
      <h1>${r.title}</h1>
      ${hero}
      <div class="body"><p>${r.text.replace(/\n/g,"</p><p>")}</p></div>
      ${gallery}
    </article>
  </main>
  <footer class="site-foot">
    <p class="legal">Seit 1895 für die Heimat. Ortswehr der Marktgemeinde Kirchbach, im Dienst für den Bezirk Hermagor. <a class="admin-link" href="/admin/">·</a></p>
  </footer>
</body>
</html>`;
    }
    form.onsubmit = (e) => {
      e.preventDefault();
      if (document.getElementById("pw").value === PW) {
        sessionStorage.setItem("ff-admin", "1");
        login.classList.add("hidden");
        app.classList.remove("hidden");
        showList();
      } else {
        err.classList.remove("hidden");
      }
    };
    document.getElementById("new-btn").onclick = () => {
      reports.unshift({ id: "neu", title: "", date: new Date().toISOString().slice(0,10), text: "", photos: [] });
      showList();
      open(0);
    };
    document.getElementById("cancel").onclick = () => editor.classList.add("hidden");
    document.getElementById("logout").onclick = () => {
      sessionStorage.removeItem("ff-admin");
      location.reload();
    };
    editor.onsubmit = (e) => {
      e.preventDefault();
      const i = Number(editor.dataset.i);
      const r = reports[i];
      r.title = document.getElementById("title").value;
      r.date = document.getElementById("date").value;
      r.text = document.getElementById("text").value;
      r.photos = document.getElementById("photos").value.split("\n").map(s => s.trim()).filter(Boolean);
      r.id = slug(r.title) || "bericht";
      const blob = new Blob([htmlFor(r)], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
      alert("HTML heruntergeladen. Lege die Datei unter berichte/" + r.date.slice(0,4) + "/" + r.id + "/ ab oder schick sie mir zum Einspielen.");
      editor.classList.add("hidden");
      showList();
    };
    if (sessionStorage.getItem("ff-admin") === "1") {
      login.classList.add("hidden");
      app.classList.remove("hidden");
      showList();
    }
  </script>
</body>
</html>
